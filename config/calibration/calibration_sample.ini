; 参数样例文件（演示「源树配置随构建拷贝到输出目录」这一模式）。
;
; 构建后由 src/app/CMakeLists.txt 的 POST_BUILD 步骤拷贝为：
;     <构建目录>/bin/calibration/calibration.ini
; 因此运行时直接读可执行文件同级的 calibration/calibration.ini 即可，
; 无需关心源树路径；安装包也会连带打包该目录。
;
; 内容仅为占位，按项目实际参数替换。

[general]
; 参数文件格式版本，便于后续做兼容处理
version=1

[channel_1]
; 增益与零点偏移
gain=1.0
offset=0.0

[channel_2]
gain=1.0
offset=0.0
